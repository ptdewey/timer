<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer &amp; Stopwatch</title>
<script>
  // resolve theme + saved accents before first paint: no flash of default colour
  (function () {
    var root = document.documentElement;
    var HEX = /^#[0-9a-f]{6}$/i;
    root.classList.add("booting"); // no transition flash on the first paint
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem("timer-appearance") || "{}") || {}; } catch (e) {}

    var theme = saved.theme === "light" || saved.theme === "dark" ? saved.theme : null;
    if (!theme) {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    root.dataset.theme = theme;

    // values equal to the palette defaults stay unset so the theme decides
    if (typeof saved.timerColor === "string" && HEX.test(saved.timerColor) &&
        saved.timerColor.toLowerCase() !== "#f0a03c") {
      root.style.setProperty("--timer", saved.timerColor);
    }
    if (typeof saved.stopwatchColor === "string" && HEX.test(saved.stopwatchColor) &&
        saved.stopwatchColor.toLowerCase() !== "#51c7d4") {
      root.style.setProperty("--stopwatch", saved.stopwatchColor);
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="split">

  <!-- ============ TIMER (left) ============ -->
  <section class="pane pane--timer" aria-labelledby="timer-heading">
    <h1 class="pane__title" id="timer-heading">Timer</h1>

    <div class="ring" id="timer-ring">
      <div class="ring__inner">
        <output class="display" id="timer-display" aria-live="off">05:00</output>
        <span class="display__hint" id="timer-status">ready</span>
      </div>
    </div>

    <form class="config" id="timer-config" autocomplete="off">
      <div class="field">
        <label for="timer-hours">Hours</label>
        <input type="number" id="timer-hours" min="0" max="99" step="1" value="0" inputmode="numeric">
      </div>
      <div class="field">
        <label for="timer-minutes">Minutes</label>
        <input type="number" id="timer-minutes" min="0" max="59" step="1" value="5" inputmode="numeric">
      </div>
      <div class="field">
        <label for="timer-seconds">Seconds</label>
        <input type="number" id="timer-seconds" min="0" max="59" step="1" value="0" inputmode="numeric">
      </div>
    </form>

    <div class="presets" role="group" aria-label="Timer presets">
      <button type="button" class="chip" data-preset="60">1 min</button>
      <button type="button" class="chip" data-preset="300">5 min</button>
      <button type="button" class="chip" data-preset="600">10 min</button>
      <button type="button" class="chip" data-preset="1500">25 min</button>
      <button type="button" class="chip" data-preset="3600">1 hour</button>
    </div>

    <div class="controls">
      <button type="button" class="btn btn--primary" id="timer-toggle">Start</button>
      <button type="button" class="btn" id="timer-reset">Reset</button>
    </div>
  </section>

<!-- ============ START / PAUSE BOTH (sits on the seam) ============ -->
<button type="button" class="both-btn" id="both-toggle"
        aria-label="Start both clocks" title="Start both (B)">
  <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
    <path d="M9 5.4v13.2l10.4-6.6z"/>
  </svg>
  <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
    <rect x="7.6" y="5" width="3.4" height="14" rx="1.3"/>
    <rect x="13" y="5" width="3.4" height="14" rx="1.3"/>
  </svg>
</button>

  <!-- ============ STOPWATCH (right) ============ -->
  <section class="pane pane--stopwatch" aria-labelledby="stopwatch-heading">
    <h2 class="pane__title" id="stopwatch-heading">Stopwatch</h2>

    <div class="ring ring--plain">
      <div class="ring__inner">
        <output class="display" id="stopwatch-display" aria-live="off">00:00.00</output>
        <span class="display__hint" id="stopwatch-status">ready</span>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn btn--primary" id="stopwatch-toggle">Start</button>
      <button type="button" class="btn" id="stopwatch-lap">Lap</button>
      <button type="button" class="btn" id="stopwatch-reset">Reset</button>
    </div>

    <ol class="laps" id="stopwatch-laps" aria-label="Laps"></ol>
  </section>

</main>

<!-- ============ APPEARANCE ============ -->
<div class="settings-dock" id="settings-dock">
  <section class="settings" id="settings-panel" role="dialog" aria-label="Appearance" hidden>
    <header class="settings__head">
      <h2 class="settings__title">Appearance</h2>
      <button type="button" class="settings__close" id="settings-close" aria-label="Close settings">&times;</button>
    </header>

    <fieldset class="settings__group">
      <legend>Timer color</legend>
      <div class="color-row">
        <input type="color" id="timer-color" class="color-input" value="#f0a03c" aria-label="Timer color">
        <div class="swatches" id="timer-swatches"></div>
      </div>
    </fieldset>

    <fieldset class="settings__group">
      <legend>Stopwatch color</legend>
      <div class="color-row">
        <input type="color" id="stopwatch-color" class="color-input" value="#51c7d4" aria-label="Stopwatch color">
        <div class="swatches" id="stopwatch-swatches"></div>
      </div>
    </fieldset>

    <fieldset class="settings__group">
      <legend>Theme</legend>
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system">System</button>
        <button type="button" data-theme-choice="dark">Dark</button>
        <button type="button" data-theme-choice="light">Light</button>
      </div>
    </fieldset>

    <button type="button" class="settings__reset" id="settings-reset">Reset to defaults</button>
  </section>

  <button type="button" class="settings__button" id="settings-toggle"
          aria-expanded="false" aria-controls="settings-panel" aria-label="Appearance settings">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.1"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.56 1.03z"/>
    </svg>
  </button>
</div>

<script src="app.js"></script>
</body>
</html>
